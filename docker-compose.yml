version: "3.9"

services:
  app:
    build: ./app
    working_dir: /app
    command: ["npm", "run", "dev"]
    volumes:
      - ./app:/app
    ports:
      - "3000:3000"

  ai:
    build: ./ai
    working_dir: /ai
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000"]
    volumes:
      - ./ai:/ai
    ports:
      - "9000:9000"
